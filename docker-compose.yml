services:
  chatgpt-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt-discord-bot:latest
    container_name: chatgpt-discord-bot
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
