name: Verify prepaid preparation
on:
  push:
    branches: [codex/prepaid-usage-limits-20260929]
    paths: [.github/workflows/prepare-prepaid.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PREPAID_MODE: off
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify and apply exact locally tested change
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/prepaid-usage-limits-20260929'
          encoded = ''.join(pathlib.Path(f'.prepared/prepaid.{i}.b64').read_text().strip() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fccb2afb5c7b4b127f612f456122867709ebd7dc8cf8e071165bdbd95dd8c012'
          target = '/tmp/prepaid-tested.patch'
          pathlib.Path(target).write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', target], check=True)
          subprocess.run(['git', 'apply', target], check=True)
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify all checks without real paid API calls
        run: |
          set -o pipefail
          ruff check .
          ruff format --check .
          mypy src main.py utils
          mypy --platform win32 src main.py utils
          python -m pytest -q | tee /tmp/prepaid-tests.txt
          python -m compileall -q src main.py utils tests
          python -m pip check
      - name: Commit only to isolated preparation branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/prepaid-usage-limits-20260929'
          rm .prepared/prepaid.*.b64
          rmdir .prepared
          rm .github/workflows/prepare-prepaid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: prepare prepaid server plans from $0.99 with bounded usage and launch gates'
          git push origin HEAD:refs/heads/codex/prepaid-usage-limits-20260929
          git rev-parse HEAD | tee /tmp/prepaid-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepaid-preparation-validation
          path: |
            /tmp/prepaid-tests.txt
            /tmp/prepaid-commit.txt
          retention-days: 7
