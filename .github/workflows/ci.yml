name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src main.py utils
      - name: Test
        run: pytest
      - name: Compile Python files
        run: python -m compileall -q main.py src utils tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t discord-bot:test .
      - name: Check container configuration without connecting
        run: >-
          docker run --rm
          -e DISCORD_BOT_TOKEN=test-discord-token
          -e GEMINI_API_KEY=test-gemini-key
          discord-bot:test python main.py --check-config
