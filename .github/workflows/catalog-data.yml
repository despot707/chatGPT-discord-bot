name: Build public game catalog
on:
  push:
    branches: [codex/catalog-context-icons-20260928]
    paths: [.github/workflows/catalog-data.yml, scripts/build_game_catalog.py]
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Import and validate public catalog
        run: python -u scripts/build_game_catalog.py
      - name: Format catalog builder
        run: |
          python -m pip install ruff==0.16.9
          ruff check --fix scripts/build_game_catalog.py
          ruff format scripts/build_game_catalog.py
      - name: Commit catalog without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/game_catalog.json.gz assets/game_catalog_source.json scripts/build_game_catalog.py
          git commit -m 'data: add verified cross-platform game titles with stable Wikidata IDs'
          git push origin HEAD:refs/heads/codex/catalog-context-icons-20260928
      - uses: actions/upload-artifact@v4
        with:
          name: game-catalog-data
          path: assets/game_catalog*
          retention-days: 1
