name: Private profile verification
on:
  push:
    branches: [codex/private-profile-20260928, codex/modernize-discord-bot]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Private profile tests
        run: pytest -q tests/test_member_settings.py tests/test_profile_ui.py
      - name: Compile runtime
        if: always()
        run: python -m compileall -q src main.py tests
      - name: Full suite
        if: always()
        run: pytest -q
