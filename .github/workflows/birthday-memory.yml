name: Birthday memory verification
on:
  push:
    branches: ['codex/birthday-memory-*', 'codex/modernize-discord-bot']
    paths: ['src/**', 'tests/**', '.github/workflows/birthday-memory.yml']
permissions:
  contents: read
jobs:
  birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Birthday and real client integration tests
        run: pytest -q tests/test_birthday_memory.py tests/test_birthday_backfill.py tests/test_birthday_client_smoke.py
      - name: Compile code
        run: python -m compileall -q src main.py tests
      - name: Full existing test suite
        run: pytest -q
