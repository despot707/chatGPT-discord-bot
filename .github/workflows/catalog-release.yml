name: Verify and assemble catalog release
on:
  push:
    branches: [codex/catalog-context-icons-20260928]
    paths: [.github/workflows/catalog-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify exact tested patch and apply
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          text = ''.join(pathlib.Path(f'.release/catalog.{n}.b64').read_text().strip() for n in range(3))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fd398a9badf76f24f2715778c27fb7cd248873a798671fd98b01a281c871cddd'
          pathlib.Path('/tmp/catalog-upgrade.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/catalog-upgrade.patch'],check=True)
          subprocess.run(['git','apply','/tmp/catalog-upgrade.patch'],check=True)
      - name: Full checks without weakening existing tests
        run: |
          ruff check .
          ruff format --check .
          mypy src main.py utils
          mypy --platform win32 src main.py utils
          pytest -q
          python -m compileall -q src main.py tests scripts
      - name: Import complete public catalog with default-language fallback
        run: python -u scripts/build_game_catalog.py
      - name: Verify packaged catalog and icon
        shell: python
        run: |
          import json, pathlib, time
          from PIL import Image
          from src.game_catalog import GameCatalog
          start=time.monotonic()
          c=GameCatalog('/tmp/catalog-release.sqlite3')
          assert c.count > 100000, c.count
          for query,title in [('lea','League of Legends'),('world of warcraft','World of Warcraft'),('super mario bros','Super Mario Bros.')]:
              rows=c.search(query)
              assert any(r['name'].casefold()==title.casefold() for r in rows), (query,rows)
          im=Image.open('assets/luna-avatar.jpg'); assert im.size==(256,256)
          print('Verified catalog titles:',c.count,'index initialization seconds:',round(time.monotonic()-start,3))
          print(pathlib.Path('assets/game_catalog_source.json').read_text())
      - name: Remove transfer tooling and commit only verified release
        run: |
          rm .release/catalog.*.b64
          rmdir .release
          rm .github/workflows/catalog-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: canonical game catalog, actual Luna branding, and automatic recent context'
          git push origin HEAD:refs/heads/codex/catalog-context-icons-20260928
          git archive --format=tar.gz HEAD > /tmp/catalog-release-code.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-release-code
          path: /tmp/catalog-release-code.tar.gz
          retention-days: 1
