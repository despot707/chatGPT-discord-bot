name: Public site

on:
  push:
    paths: ["site/**", "PRIVACY.md", "TERMS.md", "docs/prepaid-plans.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "PRIVACY.md", "TERMS.md", "docs/prepaid-plans.md", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build and check public pages
        working-directory: site
        run: npm test
